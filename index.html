<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>視覺智慧</title>
    <link rel="apple-touch-icon" href="https://i.imgur.com/your_icon_placeholder.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="視覺智慧">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { user-select: none; -webkit-user-select: none; box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif; overflow: hidden; height: 100vh; width: 100vw; position: relative; }

        .apple-pill-card {
            background: rgba(35, 35, 40, 0.82);
            backdrop-filter: blur(35px) saturate(200%);
            -webkit-backdrop-filter: blur(35px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            position: relative;
            width: 90vw;
            max-width: 420px;
            border-radius: 9999px;
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            max-height: 52px;
            overflow: hidden;
        }

        .apple-pill-card.expanded {
            border-radius: 28px !important;
            max-height: 48vh;
            padding-bottom: 12px;
        }

        .siri-pill-border::before {
            content: ''; position: absolute; inset: -1.5px; border-radius: inherit;
            background: linear-gradient(90deg, #38bdf8, #a855f7, #ec4899, #38bdf8);
            background-size: 300% 300%; z-index: -1; animation: siriBorderFlow 4s linear infinite; opacity: 0.85; filter: blur(3px);
        }
        @keyframes siriBorderFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .glass-btn-apple {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s ease;
        }
        .glass-btn-apple:active { transform: scale(0.92); }

        .shutter-outer {
            width: 80px; height: 80px; border-radius: 9999px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.35);
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.15s ease;
        }
        .shutter-outer:active { transform: scale(0.9); }
        .shutter-inner {
            width: 62px; height: 62px; border-radius: 9999px;
            background: radial-gradient(circle, #f3f4f6 0%, #9ca3af 100%);
            box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.8), 0 3px 8px rgba(0, 0, 0, 0.3);
        }

        .zoom-dial-container {
            position: relative; width: 100%; overflow-x: auto; white-space: nowrap; scrollbar-width: none; padding: 6px 0;
        }
        .zoom-dial-container::-webkit-scrollbar { display: none; }
        .zoom-dial-track { display: inline-flex; align-items: center; padding: 0 50vw; }
        .zoom-tick { display: flex; flex-direction: column; align-items: center; cursor: pointer; padding: 0 12px; transition: transform 0.2s ease; }
        .zoom-tick span { font-size: 12px; font-weight: 500; color: rgba(255, 255, 255, 0.5); transition: color 0.2s ease; }
        .zoom-tick.active span { color: #facc15; font-weight: 700; transform: scale(1.1); }
        .zoom-tick .dot { width: 3px; height: 3px; background: rgba(255, 255, 255, 0.4); border-radius: 50%; margin-top: 3px; }
        .zoom-tick.active .dot { background: #facc15; width: 5px; height: 5px; }
    </style>
</head>
<body class="flex flex-col justify-between">

    <div class="absolute inset-0 z-0 overflow-hidden">
        <video id="cameraStream" autoplay playsinline class="w-full h-full object-cover transition-transform duration-100"></video>
        <div class="absolute inset-0 bg-gradient-to-b from-black/25 via-transparent to-black/80 pointer-events-none"></div>
    </div>

    <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">

    <div class="relative z-30 pt-12 px-6 flex justify-between items-center">
        <button onclick="toggleCameraFacing()" class="w-9 h-9 rounded-full glass-btn-apple flex items-center justify-center text-white/80">
            <i class="fa-solid fa-camera-rotate text-sm"></i>
        </button>
        <button onclick="openSettings()" class="w-9 h-9 rounded-full glass-btn-apple flex items-center justify-center text-white/80">
            <i class="fa-solid fa-gear text-sm"></i>
        </button>
    </div>

    <div class="relative z-30 flex flex-col items-center pb-2 px-4 mt-auto">
        <div id="aiStatusPill" class="siri-pill-border apple-pill-card px-5 py-3 text-white text-sm shadow-2xl mb-2 flex flex-col">
            <div class="flex items-center justify-between cursor-pointer select-none" onclick="toggleExpandPill()">
                <div class="flex items-center space-x-2.5 truncate pr-2">
                    <span id="pillIcon" class="text-cyan-300 shrink-0"><i class="fa-solid fa-sparkles"></i></span>
                    <span id="pillTitle" class="font-medium tracking-wide truncate">點擊快門開始辨識</span>
                </div>
                <div id="expandArrow" class="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-xs text-white/80 shrink-0 transition-transform duration-300">
                    <i id="arrowIcon" class="fa-solid fa-chevron-up"></i>
                </div>
            </div>

            <div id="expandedContent" class="mt-3 pt-3 border-t border-white/15 text-white/90 text-xs leading-relaxed overflow-y-auto max-h-[35vh] opacity-0 transition-opacity duration-300">
                <p id="pillFullText">詳細內容將顯示於此...</p>
            </div>
        </div>

        <div class="zoom-dial-container" id="zoomDial">
            <div class="zoom-dial-track flex space-x-3" id="zoomTrack"></div>
        </div>
    </div>

    <div class="relative z-30 pb-10 px-10 flex items-center justify-between max-w-sm mx-auto w-full">
        <button onclick="openAskDrawer()" class="flex flex-col items-center space-y-1.5">
            <div class="w-14 h-14 rounded-full glass-btn-apple flex items-center justify-center text-white text-xl shadow-lg">
                <i class="fa-regular fa-comment-dots"></i>
            </div>
            <span class="text-[12px] text-white/90 font-medium tracking-wide">詢問</span>
        </button>

        <button onclick="captureAndAnalyze()" class="shutter-outer">
            <div class="shutter-inner"></div>
        </button>

        <button onclick="document.getElementById('fileInput').click()" class="flex flex-col items-center space-y-1.5">
            <div class="w-14 h-14 rounded-full glass-btn-apple flex items-center justify-center text-white text-xl shadow-lg">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <span class="text-[12px] text-white/90 font-medium tracking-wide">搜尋</span>
        </button>
    </div>

    <div id="askDrawer" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex items-end justify-center">
        <div class="apple-pill-card expanded bg-gray-900/95 w-full max-w-lg rounded-t-3xl p-6 border-t border-white/20 space-y-4">
            <div class="w-12 h-1.5 bg-white/30 rounded-full mx-auto mb-2"></div>
            <div class="flex items-center justify-between">
                <h3 class="text-base font-bold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-sparkles text-cyan-400"></i>
                    <span>向視覺智慧提問</span>
                </h3>
                <button onclick="closeAskDrawer()" class="text-white/60 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div>
                <input type="text" id="customPromptInput" placeholder="例如：這是什麼？" class="w-full bg-black/50 border border-white/20 rounded-2xl px-4 py-3.5 text-white text-sm focus:outline-none focus:border-cyan-400">
            </div>
            <button onclick="submitCustomAsk()" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-purple-600 rounded-2xl font-semibold text-white shadow-lg">
                送出提問
            </button>
        </div>
    </div>

    <!-- 設定 Modal (含版本號) -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-2xl flex items-center justify-center p-6">
        <div class="apple-pill-card expanded bg-gray-900/90 w-full max-w-md rounded-3xl p-6 border border-white/20 space-y-4">
            <div class="flex items-center justify-between pb-2 border-b border-white/10">
                <h2 class="text-base font-bold text-white">設定 API Key</h2>
                <button onclick="closeSettings()" class="text-white/60 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div>
                <label class="text-xs text-cyan-300 block mb-1">Gemini API Key</label>
                <input type="password" id="apiKeyInput" placeholder="請貼上 API Key" class="w-full bg-black/60 border border-white/20 rounded-2xl px-4 py-3 text-white text-sm focus:outline-none focus:border-cyan-400">
            </div>
            <button onclick="saveSettings()" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-2xl font-semibold text-white shadow-lg">儲存設定</button>
            <div class="text-center pt-2 border-t border-white/10">
                <span class="text-[11px] text-white/40 tracking-wider">Visual Intelligence v2.7.4 (Build 2026.10)</span>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_KEY = "";
        if (!localStorage.getItem('gemini_api_key')) {
            localStorage.setItem('gemini_api_key', DEFAULT_KEY);
        }

        let currentStream = null;
        let currentFacingMode = "environment";
        let currentZoom = 1.0;
        let isExpanded = false;
        let fullResponseText = "點擊快門開始辨識";

        // 動態生成變焦刻度：0.5 到 5 之間所有刻度 (0.5步進)，5 到 120 以 10 為單位
        const zoomSteps = [];
        for (let i = 0.5; i <= 5.0; i += 0.5) {
            zoomSteps.push(Number(i.toFixed(1)));
        }
        for (let i = 10; i <= 120; i += 10) {
            zoomSteps.push(i);
        }

        const zoomTrack = document.getElementById('zoomTrack');
        zoomSteps.forEach(val => {
            const div = document.createElement('div');
            div.className = `zoom-tick ${val === 1.0 ? 'active' : ''}`;
            div.innerHTML = `<span>${val}x</span><div class="dot"></div>`;
            div.onclick = () => setZoom(val);
            zoomTrack.appendChild(div);
        });

        async function initCamera() {
            if (currentStream) currentStream.getTracks().forEach(track => track.stop());
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                document.getElementById('cameraStream').srcObject = currentStream;
                applyZoom(currentZoom);
            } catch (err) { console.log("相機啟動失敗"); }
        }
        initCamera();

        function toggleCameraFacing() {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            initCamera();
        }

        function setZoom(zoomVal) {
            currentZoom = zoomVal;
            const ticks = zoomTrack.children;
            zoomSteps.forEach((val, idx) => {
                if (val === zoomVal) ticks[idx].classList.add('active');
                else ticks[idx].classList.remove('active');
            });
            applyZoom(zoomVal);
        }

        function applyZoom(zoomVal) {
            const videoEl = document.getElementById('cameraStream');
            videoEl.style.transform = `scale(${zoomVal})`;
        }

        function toggleExpandPill() {
            isExpanded = !isExpanded;
            const pillCard = document.getElementById('aiStatusPill');
            const arrowIcon = document.getElementById('arrowIcon');
            const expandedContent = document.getElementById('expandedContent');

            if (isExpanded) {
                pillCard.classList.add('expanded');
                arrowIcon.className = "fa-solid fa-chevron-down";
                expandedContent.style.opacity = "1";
            } else {
                pillCard.classList.remove('expanded');
                arrowIcon.className = "fa-solid fa-chevron-up";
                expandedContent.style.opacity = "0";
            }
        }

        function openSettings() { document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || ''; document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }
        function saveSettings() {
            const val = document.getElementById('apiKeyInput').value.trim();
            if (val) { localStorage.setItem('gemini_api_key', val); closeSettings(); alert('已儲存！'); }
        }

        function openAskDrawer() { document.getElementById('askDrawer').classList.remove('hidden'); }
        function closeAskDrawer() { document.getElementById('askDrawer').classList.add('hidden'); }
        function submitCustomAsk() {
            const promptText = document.getElementById('customPromptInput').value.trim();
            closeAskDrawer();
            if (promptText) captureAndAnalyze(promptText);
        }

        async function captureAndAnalyze(customPrompt = null) {
            let apiKey = localStorage.getItem('gemini_api_key') || DEFAULT_KEY;

            fullResponseText = "分析中...";
            document.getElementById('pillTitle').innerText = fullResponseText;
            document.getElementById('pillFullText').innerText = fullResponseText;
            document.getElementById('pillIcon').innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i>`;
            if (isExpanded) toggleExpandPill();

            const video = document.getElementById('cameraStream');
            const canvas = document.createElement('canvas');
            canvas.width = 1280; canvas.height = 720;
            const ctx = canvas.getContext('2d');

            if (currentZoom > 1.0) {
                const cropWidth = (video.videoWidth || 1280) / currentZoom;
                const cropHeight = (video.videoHeight || 720) / currentZoom;
                const cropX = ((video.videoWidth || 1280) - cropWidth) / 2;
                const cropY = ((video.videoHeight || 720) - cropHeight) / 2;
                ctx.drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            }

            const base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
            sendToGemini(base64Image, apiKey, customPrompt);
        }

        function handleFileSelect(event) {
            let apiKey = localStorage.getItem('gemini_api_key') || DEFAULT_KEY;
            const file = event.target.files[0];
            if (!file) return;

            fullResponseText = "讀取照片中...";
            document.getElementById('pillTitle').innerText = fullResponseText;
            const reader = new FileReader();
            reader.onload = function(e) {
                sendToGemini(e.target.result.split(',')[1], apiKey, null);
            };
            reader.readAsDataURL(file);
        }

        async function sendToGemini(base64Image, apiKey, customPrompt) {
            const promptText = customPrompt || "請用繁體中文詳細回答：這是什麼？";
            const models = ['gemini-2.5-flash', 'gemini-1.5-flash', 'gemini-flash-lite-latest'];
            let success = false;

            for (let model of models) {
                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: "image/jpeg", data: base64Image } }] }]
                        })
                    });

                    const data = await response.json();
                    if (data.candidates && data.candidates[0].content) {
                        fullResponseText = data.candidates[0].content.parts[0].text;
                        document.getElementById('pillTitle').innerText = fullResponseText.substring(0, 18) + '... (點擊展開)';
                        document.getElementById('pillFullText').innerText = fullResponseText;
                        document.getElementById('pillIcon').innerHTML = `<i class="fa-solid fa-sparkles"></i>`;
                        success = true;
                        break;
                    }
                } catch (e) { console.log("嘗試失敗"); }
            }

            if (!success) {
                fullResponseText = "無法辨識，請檢查 API Key";
                document.getElementById('pillTitle').innerText = fullResponseText;
                document.getElementById('pillFullText').innerText = fullResponseText;
            }
        }
    </script>
</body>
</html>
