<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visual Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { user-select: none; -webkit-user-select: none; }
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; overflow: hidden; height: 100vh; width: 100vw; }
        
        /* 蘋果原版玻璃膠囊 (Pill) */
        .apple-pill {
            background: rgba(40, 40, 45, 0.65);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* 蘋果原版毛玻璃按鈕 */
        .glass-btn-apple {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        /* 經典主快門雙環設計 */
        .shutter-outer {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.35);
        }

        /* Siri 彩光流動微光邊框 */
        .siri-glow {
            position: relative;
        }
        .siri-glow::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 9999px;
            background: linear-gradient(45deg, #00f2fe, #4facfe, #a855f7, #ec4899);
            background-size: 300% 300%;
            z-index: -1;
            animation: siriGlowAnim 5s ease infinite;
            opacity: 0.8;
            filter: blur(4px);
        }
        @keyframes siriGlowAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 掃描雷射光束 */
        .laser-sweep {
            background: linear-gradient(180deg, transparent, rgba(56, 189, 248, 0.7), transparent);
            box-shadow: 0 0 15px #38bdf8;
            animation: scanLaser 2s infinite ease-in-out;
        }
        @keyframes scanLaser {
            0% { top: 0%; opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>
</head>
<body class="relative flex flex-col justify-between">

    <!-- 相機背景與掃描層 -->
    <div class="absolute inset-0 z-0 overflow-hidden">
        <video id="cameraStream" autoplay playsinline class="w-full h-full object-cover"></video>
        <div class="absolute inset-0 bg-gradient-to-b from-black/30 via-transparent to-black/70 pointer-events-none"></div>
        <div id="laserScan" class="hidden absolute left-0 right-0 h-16 laser-sweep z-10 pointer-events-none"></div>
    </div>

    <!-- 隱藏檔案上傳 -->
    <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">

    <!-- 頂部極簡留空 (避開動態島) -->
    <div class="relative z-20 pt-14 px-6 flex justify-end">
        <button onclick="openSettings()" class="w-9 h-9 rounded-full glass-btn-apple flex items-center justify-center text-white/80">
            <i class="fa-solid fa-gear text-sm"></i>
        </button>
    </div>

    <!-- 訊息固定在控制鈕正上方 (絕不遮擋瀏海、不留白) -->
    <div class="relative z-20 flex flex-col items-center pb-6 px-6 mt-auto">
        <div id="aiStatusPill" onclick="captureAndAnalyze()" class="siri-glow apple-pill px-6 py-3 rounded-full text-white text-sm font-medium flex items-center space-x-2.5 shadow-2xl cursor-pointer active:scale-95 transition-all">
            <span class="text-emerald-400">🍃</span>
            <span id="pillText" class="tracking-wide">點擊快門開始辨識</span>
        </div>
    </div>

    <!-- 底部 Apple 原版經典控制列 (Ask / Shutter / Search) -->
    <div class="relative z-25 pb-10 px-10 flex items-center justify-between max-w-sm mx-auto w-full">
        <!-- 左側 Ask (詢問) -->
        <button onclick="showAskPrompt()" class="flex flex-col items-center space-y-1 group">
            <div class="w-14 h-14 rounded-full glass-btn-apple flex items-center justify-center text-white text-xl shadow-lg">
                <i class="fa-regular fa-comment"></i>
            </div>
            <span class="text-[11px] text-white/90 font-medium tracking-wide">Ask</span>
        </button>

        <!-- 中央快門按鈕 -->
        <button onclick="captureAndAnalyze()" class="relative w-20 h-20 rounded-full shutter-outer flex items-center justify-center p-1.5 active:scale-90 transition-transform duration-200 shadow-2xl">
            <div class="w-full h-full rounded-full bg-white/95 shadow-inner flex items-center justify-center">
                <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-cyan-400 to-purple-500"></div>
            </div>
        </button>

        <!-- 右側 Search (搜尋) -->
        <button onclick="document.getElementById('fileInput').click()" class="flex flex-col items-center space-y-1 group">
            <div class="w-14 h-14 rounded-full glass-btn-apple flex items-center justify-center text-white text-xl shadow-lg">
                <i class="fa-regular fa-image"></i>
            </div>
            <span class="text-[11px] text-white/90 font-medium tracking-wide">Search</span>
        </button>
    </div>

    <!-- 設定視窗 -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-xl flex items-center justify-center p-6">
        <div class="apple-pill bg-gray-900/90 w-full max-w-md rounded-3xl p-6 border border-white/20 space-y-4">
            <div class="flex items-center justify-between pb-2 border-b border-white/10">
                <h2 class="text-base font-bold text-white">API 設定</h2>
                <button onclick="closeSettings()" class="text-white/60 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div>
                <label class="text-xs text-cyan-300 block mb-1">Gemini API Key</label>
                <input type="password" id="apiKeyInput" class="w-full bg-black/50 border border-white/20 rounded-2xl px-4 py-3 text-white text-sm focus:outline-none focus:border-cyan-400">
            </div>
            <button onclick="saveSettings()" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-2xl font-semibold text-white shadow-lg">儲存</button>
        </div>
    </div>

    <script>
        // 預先載入指定金鑰[span_2](start_span)[span_2](end_span)[span_3](start_span)[span_3](end_span)
        const PRESET_API_KEY = "AIzaSyCllR8IawGzKygvrrZj8IbfszV0Mi9vjyo";
        if (!localStorage.getItem('gemini_api_key')) {
            localStorage.setItem('gemini_api_key', PRESET_API_KEY);
        }

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { document.getElementById('cameraStream').srcObject = stream; })
            .catch(err => { console.log("相機未啟動"); });

        function openSettings() {
            document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || PRESET_API_KEY;
            document.getElementById('settingsModal').classList.remove('hidden');
        }
        function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }
        function saveSettings() {
            const val = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('gemini_api_key', val || PRESET_API_KEY);
            closeSettings();
            alert('已儲存！');
        }

        function showAskPrompt() {
            const userText = prompt("請輸入想詢問的問題：", "這是什麼？");
            if (userText) captureAndAnalyze(userText);
        }

        async function captureAndAnalyze(customPrompt = null) {
            const apiKey = localStorage.getItem('gemini_api_key') || PRESET_API_KEY;

            document.getElementById('laserScan').classList.remove('hidden');
            document.getElementById('pillText').innerText = '辨識中...';

            const video = document.getElementById('cameraStream');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

            sendToGemini(base64Image, apiKey, customPrompt);
        }

        function handleFileSelect(event) {
            const apiKey = localStorage.getItem('gemini_api_key') || PRESET_API_KEY;
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('laserScan').classList.remove('hidden');
            document.getElementById('pillText').innerText = '讀取相片中...';

            const reader = new FileReader();
            reader.onload = function(e) {
                sendToGemini(e.target.result.split(',')[1], apiKey, null);
            };
            reader.readAsDataURL(file);
        }

        async function sendToGemini(base64Image, apiKey, customPrompt) {
            const promptText = customPrompt || "請用繁體中文簡短回答（例如：Maybe: 合掌芋 或 這是合掌芋）";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: promptText },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                document.getElementById('laserScan').classList.add('hidden');

                if (data.candidates && data.candidates[0].content) {
                    const text = data.candidates[0].content.parts[0].text;
                    document.getElementById('pillText').innerText = text;
                } else if (data.error) {
                    document.getElementById('pillText').innerText = '錯誤: ' + data.error.message;
                } else {
                    document.getElementById('pillText').innerText = '無法辨識';
                }
            } catch (err) {
                document.getElementById('laserScan').classList.add('hidden');
                document.getElementById('pillText').innerText = '連線失敗';
                console.error(err);
            }
        }
    </script>
</body>
</html>
