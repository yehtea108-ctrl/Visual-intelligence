<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>視覺智慧</title>
    <!-- iOS 縮圖與標題 -->
    <link rel="apple-touch-icon" href="https://i.imgur.com/your_icon_placeholder.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="視覺智慧">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { user-select: none; -webkit-user-select: none; box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif; overflow: hidden; height: 100vh; width: 100vw; position: relative; }

        /* Apple Intelligence 螢幕外圍彩光 */
        .apple-edge-glow {
            position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: 0; transition: opacity 0.4s ease;
            box-shadow: inset 0 0 35px 8px rgba(56, 189, 248, 0.6), inset 0 0 60px 20px rgba(168, 85, 247, 0.5), inset 0 0 90px 35px rgba(236, 72, 153, 0.4);
            animation: auraPulse 2s infinite alternate ease-in-out;
        }
        .apple-edge-glow.active { opacity: 1; }
        @keyframes auraPulse {
            0% { box-shadow: inset 0 0 30px 6px rgba(56, 189, 248, 0.7), inset 0 0 50px 15px rgba(168, 85, 247, 0.5); }
            100% { box-shadow: inset 0 0 50px 14px rgba(56, 189, 248, 0.9), inset 0 0 85px 30px rgba(168, 85, 247, 0.7); }
        }

        /* iOS 原生風格通知卡片 */
        .ios-notification-banner {
            background: rgba(35, 35, 40, 0.75);
            backdrop-filter: blur(30px) saturate(190%);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        }

        /* 完全還原模擬圖：中央雙層灰白玻璃快門按鈕 */
        .shutter-mock-outer {
            width: 82px; height: 82px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
            display: flex; items-center; justify-center;
            transition: transform 0.15s ease;
        }
        .shutter-mock-outer:active { transform: scale(0.9); }
        .shutter-mock-inner {
            width: 62px; height: 62px;
            border-radius: 9999px;
            background: radial-gradient(circle, #e5e7eb 0%, #9ca3af 100%);
            box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.8), 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* 蘋果原版毛玻璃圖示按鈕 */
        .glass-btn-apple {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s ease;
        }
        .glass-btn-apple:active { transform: scale(0.92); }

        /* iOS 經典變焦切換膠囊按鈕 */
        .zoom-toggle-container {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
            padding: 3px 8px;
        }
        .zoom-btn {
            padding: 4px 8px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.2s ease;
        }
        .zoom-btn.active {
            background: rgba(255, 255, 255, 0.25);
            color: #facc15;
            font-weight: 700;
        }
    </style>
</head>
<body class="flex flex-col justify-between">

    <!-- 外圍彩光環 -->
    <div id="appleEdgeGlow" class="apple-edge-glow"></div>

    <!-- 相機畫面 -->
    <div class="absolute inset-0 z-0 overflow-hidden">
        <video id="cameraStream" autoplay playsinline class="w-full h-full object-cover transition-transform duration-100"></video>
        <div class="absolute inset-0 bg-gradient-to-b from-black/25 via-transparent to-black/80 pointer-events-none"></div>
    </div>

    <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">

    <!-- 頂部列 (切換鏡頭 / 設定) -->
    <div class="relative z-30 pt-12 px-6 flex justify-between items-center">
        <button onclick="toggleCameraFacing()" class="w-9 h-9 rounded-full glass-btn-apple flex items-center justify-center text-white/80">
            <i class="fa-solid fa-camera-rotate text-sm"></i>
        </button>
        <button onclick="openSettings()" class="w-9 h-9 rounded-full glass-btn-apple flex items-center justify-center text-white/80">
            <i class="fa-solid fa-gear text-sm"></i>
        </button>
    </div>

    <!-- iOS 訊息通知膠囊 (顯示 AI 回應或錯誤提示) -->
    <div class="relative z-30 flex flex-col items-center pb-4 px-6 mt-auto">
        <div id="aiStatusPill" onclick="captureAndAnalyze()" class="ios-notification-banner px-6 py-3 text-white text-sm font-medium flex items-center space-x-2.5 shadow-2xl cursor-pointer active:scale-95 transition-all mb-3">
            <span id="pillIcon" class="text-cyan-300"><i class="fa-solid fa-sparkles"></i></span>
            <span id="pillText" class="tracking-wide">點擊快門開始辨識</span>
        </div>

        <!-- 最高支援 120x 數位裁切變焦按鈕列 -->
        <div class="zoom-toggle-container flex items-center space-x-1 shadow-lg overflow-x-auto max-w-full">
            <button onclick="setZoom(0.5)" id="zoomBtn05" class="zoom-btn">.5x</button>
            <button onclick="setZoom(1.0)" id="zoomBtn10" class="zoom-btn active">1x</button>
            <button onclick="setZoom(2.0)" id="zoomBtn20" class="zoom-btn">2x</button>
            <button onclick="setZoom(5.0)" id="zoomBtn50" class="zoom-btn">5x</button>
            <button onclick="setZoom(10.0)" id="zoomBtn100" class="zoom-btn">10x</button>
            <button onclick="setZoom(30.0)" id="zoomBtn300" class="zoom-btn">30x</button>
            <button onclick="setZoom(120.0)" id="zoomBtn1200" class="zoom-btn">120x</button>
        </div>
    </div>

    <!-- 底部控制列 (完全比對模擬圖) -->
    <div class="relative z-30 pb-10 px-10 flex items-center justify-between max-w-sm mx-auto w-full">
        <!-- 左側：詢問 -->
        <button onclick="openAskDrawer()" class="flex flex-col items-center space-y-1.5">
            <div class="w-14 h-14 rounded-full glass-btn-apple flex items-center justify-center text-white text-xl shadow-lg">
                <i class="fa-regular fa-comment-dots"></i>
            </div>
            <span class="text-[12px] text-white/90 font-medium tracking-wide">詢問</span>
        </button>

        <!-- 中央：模擬圖原版灰色灰白玻璃雙環快門 -->
        <button onclick="captureAndAnalyze()" class="shutter-mock-outer">
            <div class="shutter-mock-inner"></div>
        </button>

        <!-- 右側：搜尋 -->
        <button onclick="document.getElementById('fileInput').click()" class="flex flex-col items-center space-y-1.5">
            <div class="w-14 h-14 rounded-full glass-btn-apple flex items-center justify-center text-white text-xl shadow-lg">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <span class="text-[12px] text-white/90 font-medium tracking-wide">搜尋</span>
        </button>
    </div>

    <!-- iOS 風格提問 Drawer -->
    <div id="askDrawer" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex items-end justify-center">
        <div class="ios-notification-banner bg-gray-900/95 w-full max-w-lg rounded-t-3xl p-6 border-t border-white/20 space-y-4">
            <div class="w-12 h-1.5 bg-white/30 rounded-full mx-auto mb-2"></div>
            <div class="flex items-center justify-between">
                <h3 class="text-base font-bold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-sparkles text-cyan-400"></i>
                    <span>向視覺智慧提問</span>
                </h3>
                <button onclick="closeAskDrawer()" class="text-white/60 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div>
                <input type="text" id="customPromptInput" placeholder="例如：這是什麼植物？或翻譯這段文字..." class="w-full bg-black/50 border border-white/20 rounded-2xl px-4 py-3.5 text-white text-sm focus:outline-none focus:border-cyan-400">
            </div>
            <button onclick="submitCustomAsk()" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-purple-600 rounded-2xl font-semibold text-white shadow-lg">
                送出提問
            </button>
        </div>
    </div>

    <!-- API Key 設定 Modal (含替換洩漏金鑰提示) -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-2xl flex items-center justify-center p-6">
        <div class="ios-notification-banner bg-gray-900/90 w-full max-w-md rounded-3xl p-6 border border-white/20 space-y-4">
            <div class="flex items-center justify-between pb-2 border-b border-white/10">
                <h2 class="text-base font-bold text-white">設定 API Key</h2>
                <button onclick="closeSettings()" class="text-white/60 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p class="text-xs text-amber-300">舊的公開金鑰已遭 Google 系統鎖定，請貼上您個人申請的最新 Gemini API Key：</p>
            <div>
                <input type="password" id="apiKeyInput" placeholder="貼上 AIza... 金鑰" class="w-full bg-black/60 border border-white/20 rounded-2xl px-4 py-3 text-white text-sm focus:outline-none focus:border-cyan-400">
            </div>
            <button onclick="saveSettings()" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-2xl font-semibold text-white shadow-lg">儲存並儲存</button>
        </div>
    </div>

    <script>
        let currentStream = null;
        let currentFacingMode = "environment";
        let currentZoom = 1.0;

        async function initCamera() {
            if (currentStream) currentStream.getTracks().forEach(track => track.stop());
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                document.getElementById('cameraStream').srcObject = currentStream;
                applyZoom(currentZoom);
            } catch (err) {
                console.log("相機啟動失敗:", err);
            }
        }
        initCamera();

        function toggleCameraFacing() {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            initCamera();
        }

        // 數位裁切放大（支援最高 120x）
        function setZoom(zoomVal) {
            currentZoom = zoomVal;
            const btnIds = { 0.5: 'zoomBtn05', 1: 'zoomBtn10', 2: 'zoomBtn20', 5: 'zoomBtn50', 10: 'zoomBtn100', 30: 'zoomBtn300', 120: 'zoomBtn1200' };
            Object.values(btnIds).forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.remove('active');
            });
            if (btnIds[zoomVal]) document.getElementById(btnIds[zoomVal]).classList.add('active');

            applyZoom(zoomVal);
        }

        function applyZoom(zoomVal) {
            const videoEl = document.getElementById('cameraStream');
            videoEl.style.transform = `scale(${zoomVal})`;
        }

        function openSettings() {
            document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
            document.getElementById('settingsModal').classList.remove('hidden');
        }
        function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }
        function saveSettings() {
            const val = document.getElementById('apiKeyInput').value.trim();
            if (val) {
                localStorage.setItem('gemini_api_key', val);
                closeSettings();
                alert('API Key 已更換並儲存！');
            } else {
                alert('請輸入有效的 Gemini API Key！');
            }
        }

        function openAskDrawer() { document.getElementById('askDrawer').classList.remove('hidden'); }
        function closeAskDrawer() { document.getElementById('askDrawer').classList.add('hidden'); }
        function submitCustomAsk() {
            const promptText = document.getElementById('customPromptInput').value.trim();
            closeAskDrawer();
            if (promptText) captureAndAnalyze(promptText);
        }

        async function captureAndAnalyze(customPrompt = null) {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                openSettings();
                return;
            }

            document.getElementById('appleEdgeGlow').classList.add('active');
            document.getElementById('pillText').innerText = '分析中...';
            document.getElementById('pillIcon').innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i>`;

            const video = document.getElementById('cameraStream');
            const canvas = document.createElement('canvas');
            canvas.width = 1280;
            canvas.height = 720;
            const ctx = canvas.getContext('2d');

            // 強制數位裁切變焦 (Digital Crop Zoom up to 120x)
            if (currentZoom > 1.0) {
                const cropWidth = (video.videoWidth || 1280) / currentZoom;
                const cropHeight = (video.videoHeight || 720) / currentZoom;
                const cropX = ((video.videoWidth || 1280) - cropWidth) / 2;
                const cropY = ((video.videoHeight || 720) - cropHeight) / 2;
                ctx.drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            }

            const base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
            sendToGemini(base64Image, apiKey, customPrompt);
        }

        function handleFileSelect(event) {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) { openSettings(); return; }
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('appleEdgeGlow').classList.add('active');
            document.getElementById('pillText').innerText = '讀取照片中...';

            const reader = new FileReader();
            reader.onload = function(e) {
                sendToGemini(e.target.result.split(',')[1], apiKey, null);
            };
            reader.readAsDataURL(file);
        }

        async function sendToGemini(base64Image, apiKey, customPrompt) {
            const promptText = customPrompt || "請用繁體中文簡短回答（例如：可能是：百香果）";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: promptText },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                document.getElementById('appleEdgeGlow').classList.remove('active');

                if (data.candidates && data.candidates[0].content) {
                    const text = data.candidates[0].content.parts[0].text;
                    document.getElementById('pillText').innerText = text;
                    document.getElementById('pillIcon').innerHTML = `<i class="fa-solid fa-sparkles"></i>`;
                } else if (data.error) {
                    document.getElementById('pillText').innerText = '錯誤: ' + data.error.message;
                    document.getElementById('pillIcon').innerHTML = `<i class="fa-solid fa-circle-exclamation text-amber-400"></i>`;
                    if (data.error.message.includes('leaked') || data.error.message.includes('invalid')) {
                        openSettings();
                    }
                } else {
                    document.getElementById('pillText').innerText = '無法辨識';
                }
            } catch (err) {
                document.getElementById('appleEdgeGlow').classList.remove('active');
                document.getElementById('pillText').innerText = '連線失敗';
                console.error(err);
            }
        }
    </script>
</body>
</html>
