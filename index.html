<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Siri 視覺智慧 - iOS 空間體驗</title>
    <!-- 引入 Tailwind CSS 與 FontAwesome 圖示庫 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* iOS 空間玻璃擬態 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.3);
        }

        /* 快門光暈環 */
        .shutter-ring {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.3);
        }

        /* 雷射掃描動畫線 */
        .laser-line {
            background: linear-gradient(180deg, transparent, rgba(56, 189, 248, 0.8), transparent);
            box-shadow: 0 0 15px #38bdf8;
            animation: scanLaser 2s infinite ease-in-out;
        }

        @keyframes scanLaser {
            0% { top: 0%; opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Siri 彩光邊框動畫 */
        .siri-glow-border {
            position: relative;
        }
        .siri-glow-border::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 9999px;
            background: linear-gradient(45deg, #00f2fe, #4facfe, #000000, #ff0844, #ffb199);
            background-size: 400% 400%;
            z-index: -1;
            animation: siriGradient 6s ease infinite;
            opacity: 0.75;
            filter: blur(4px);
        }

        @keyframes siriGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 瞄準標籤與動態縮放 */
        .reticle-box {
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
            animation: pulseReticle 1.5s infinite alternate ease-in-out;
        }

        @keyframes pulseReticle {
            from { transform: scale(0.98); opacity: 0.8; }
            to { transform: scale(1.02); opacity: 1; }
        }
    </style>
</head>
<body class="relative flex flex-col justify-between">

    <!-- 1. 背景流體 Canvas 動畫 (WebGL Siri Aura) -->
    <canvas id="auraCanvas" class="absolute inset-0 z-0 pointer-events-none w-full h-full opacity-60"></canvas>

    <!-- 2. 全螢幕相機畫面與動態掃描層 -->
    <div class="absolute inset-0 z-0 overflow-hidden">
        <video id="cameraStream" autoplay playsinline class="w-full h-full object-cover"></video>
        <div class="absolute inset-0 bg-gradient-to-b from-black/50 via-transparent to-black/80 pointer-events-none"></div>
        
        <!-- 雷射掃描線 (預設隱藏，分析時觸發) -->
        <div id="laserScan" class="hidden absolute left-0 right-0 h-16 laser-line z-10 pointer-events-none"></div>

        <!-- 視角瞄準邊框 HUD -->
        <div id="targetHUD" class="hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 reticle-box rounded-3xl pointer-events-none flex items-center justify-center">
            <div class="w-3 h-3 bg-cyan-400 rounded-full animate-ping"></div>
        </div>
    </div>

    <!-- 隱藏的照片選擇器 -->
    <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">

    <!-- 3. 頂端導覽列 -->
    <div class="relative z-20 flex justify-between items-center px-6 pt-12">
        <button onclick="playSiriAudio('click')" class="w-11 h-11 rounded-full glass-btn flex items-center justify-center text-white">
            <i class="fa-solid fa-chevron-left text-lg"></i>
        </button>

        <div class="flex items-center space-x-2">
            <span class="text-xs font-semibold tracking-widest text-cyan-300 uppercase bg-black/40 px-3 py-1 rounded-full border border-cyan-500/30">Visual Intelligence</span>
        </div>

        <button onclick="openSettings()" class="w-11 h-11 rounded-full glass-btn flex items-center justify-center text-white">
            <i class="fa-solid fa-gear text-lg"></i>
        </button>
    </div>

    <!-- 4. 中央 Siri 浮動面板 (顯示即時辨識狀態與結果) -->
    <div class="relative z-20 flex flex-col items-center justify-center flex-grow px-6">
        <div id="aiStatusPill" onclick="captureAndAnalyze()" class="siri-glow-border glass-panel px-7 py-3.5 rounded-full text-white text-base font-medium flex items-center space-x-3 shadow-2xl cursor-pointer transition-all hover:scale-105 active:scale-95">
            <div id="statusIcon">
                <i class="fa-solid fa-sparkles text-cyan-300 animate-pulse text-lg"></i>
            </div>
            <span id="pillText" class="tracking-wide">點擊快門開始視覺智慧辨識</span>
        </div>
    </div>

    <!-- 5. 底部 Apple Visual Intelligence 經典控制區 -->
    <div class="relative z-20 pb-12 px-8 flex items-center justify-between max-w-md mx-auto w-full">
        <!-- 左側：詢問 / 對話按鈕 -->
        <button onclick="showAskPrompt()" class="flex flex-col items-center space-y-1.5 group">
            <div class="w-16 h-16 rounded-full glass-btn flex items-center justify-center text-white text-2xl shadow-xl">
                <i class="fa-regular fa-comment"></i>
            </div>
            <span class="text-xs text-white/90 font-medium tracking-wider">詢問</span>
        </button>

        <!-- 中央：大型金屬玻璃快門按鈕 -->
        <button onclick="captureAndAnalyze()" class="relative w-22 h-22 rounded-full shutter-ring flex items-center justify-center p-2 active:scale-90 transition-all duration-200 shadow-2xl">
            <div class="w-full h-full rounded-full bg-white/95 shadow-inner flex items-center justify-center">
                <div id="shutterSpinner" class="w-8 h-8 rounded-full bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500"></div>
            </div>
        </button>

        <!-- 右側：相簿搜尋按鈕 -->
        <button onclick="document.getElementById('fileInput').click()" class="flex flex-col items-center space-y-1.5 group">
            <div class="w-16 h-16 rounded-full glass-btn flex items-center justify-center text-white text-2xl shadow-xl">
                <i class="fa-regular fa-image"></i>
            </div>
            <span class="text-xs text-white/90 font-medium tracking-wider">搜尋</span>
        </button>
    </div>

    <!-- 6. 設定視窗 Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-xl flex items-center justify-center p-6">
        <div class="glass-panel bg-gray-900/90 w-full max-w-md rounded-3xl p-6 border border-white/20 space-y-5">
            <div class="flex items-center justify-between pb-2 border-b border-white/10">
                <h2 class="text-lg font-bold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-sliders text-cyan-400"></i>
                    <span>Siri 系統設定</span>
                </h2>
                <button onclick="closeSettings()" class="text-white/60 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-semibold text-cyan-300 block mb-1.5">Google Gemini API 金鑰 (Key)</label>
                    <input type="password" id="apiKeyInput" placeholder="貼上 AIza... 開頭之密鑰" class="w-full bg-black/50 border border-white/20 rounded-2xl px-4 py-3 text-white text-sm focus:outline-none focus:border-cyan-400 transition-colors">
                    <p class="text-xs text-white/50 mt-1.5">密鑰將安全儲存於本機瀏覽器 LocalStorage。</p>
                </div>
            </div>

            <button onclick="saveSettings()" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 via-blue-600 to-purple-600 rounded-2xl font-semibold text-white shadow-lg active:scale-98 transition-transform">
                儲存設定
            </button>
        </div>
    </div>

    <!-- JavaScript 腳本邏輯處理區 -->
    <script>
        // Web Audio API 音效合成器 (擬真 Siri 聲效)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSiriAudio(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'start') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            }
        }

        // 開啟環境相機串流
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { document.getElementById('cameraStream').srcObject = stream; })
            .catch(err => { console.log("無法啟動相機，預設使用照片選擇器"); });

        // 設定選單邏輯
        function openSettings() {
            playSiriAudio('click');
            document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
            document.getElementById('settingsModal').classList.remove('hidden');
        }
        function closeSettings() {
            playSiriAudio('click');
            document.getElementById('settingsModal').classList.add('hidden');
        }
        function saveSettings() {
            playSiriAudio('success');
            localStorage.setItem('gemini_api_key', document.getElementById('apiKeyInput').value.trim());
            closeSettings();
        }

        function showAskPrompt() {
            playSiriAudio('click');
            const userText = prompt("請輸入想詢問視覺智慧的問題：", "這張照片裡有什麼細節？");
            if (userText) {
                captureAndAnalyze(userText);
            }
        }

        // 拍照與視覺智慧主邏輯
        async function captureAndAnalyze(customPrompt = null) {
            playSiriAudio('start');
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                alert('請先點選右上角齒輪設定 Gemini API Key！');
                openSettings();
                return;
            }

            // 觸發視覺掃描效果
            document.getElementById('laserScan').classList.remove('hidden');
            document.getElementById('targetHUD').classList.remove('hidden');
            document.getElementById('pillText').innerText = 'Siri 視覺分析中...';
            document.getElementById('statusIcon').innerHTML = `<i class="fa-solid fa-spinner animate-spin text-cyan-300 text-lg"></i>`;

            // 從視訊擷取影格
            const video = document.getElementById('cameraStream');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

            sendToGemini(base64Image, apiKey, customPrompt);
        }

        function handleFileSelect(event) {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                alert('請先設定 API Key！');
                openSettings();
                return;
            }
            const file = event.target.files[0];
            if (!file) return;

            playSiriAudio('start');
            document.getElementById('laserScan').classList.remove('hidden');
            document.getElementById('pillText').innerText = '正在讀取影像資材...';

            const reader = new FileReader();
            reader.onload = function(e) {
                sendToGemini(e.target.result.split(',')[1], apiKey, null);
            };
            reader.readAsDataURL(file);
        }

        // 發送 REST API 請求至 Gemini
        async function sendToGemini(base64Image, apiKey, customPrompt) {
            const promptText = customPrompt || "請用繁體中文簡短辨識（20字以內）：這是什麼？格式為『可能是：...』";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: promptText },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                
                // 結束掃描動畫
                document.getElementById('laserScan').classList.add('hidden');
                document.getElementById('targetHUD').classList.add('hidden');

                if (data.candidates && data.candidates[0].content) {
                    playSiriAudio('success');
                    const text = data.candidates[0].content.parts[0].text;
                    document.getElementById('pillText').innerText = text;
                    document.getElementById('statusIcon').innerHTML = `<i class="fa-solid fa-sparkles text-cyan-300 text-lg"></i>`;
                } else if (data.error) {
                    document.getElementById('pillText').innerText = 'API 錯誤: ' + (data.error.message || 'Key 無效');
                    document.getElementById('statusIcon').innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-400 text-lg"></i>`;
                } else {
                    document.getElementById('pillText').innerText = '無法解析辨識結果';
                }
            } catch (err) {
                document.getElementById('laserScan').classList.add('hidden');
                document.getElementById('targetHUD').classList.add('hidden');
                document.getElementById('pillText').innerText = '連線失敗，請檢查網路';
                console.error(err);
            }
        }

        // 流體 Aura Canvas 動畫腳本
        const auraCanvas = document.getElementById('auraCanvas');
        const auraCtx = auraCanvas.getContext('2d');
        function resizeAura() {
            auraCanvas.width = window.innerWidth;
            auraCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeAura);
        resizeAura();

        let step = 0;
        function drawAura() {
            step += 0.01;
            auraCtx.clearRect(0, 0, auraCanvas.width, auraCanvas.height);
            
            const x1 = auraCanvas.width * 0.5 + Math.sin(step) * 100;
            const y1 = auraCanvas.height * 0.7 + Math.cos(step * 0.8) * 80;
            
            const grad1 = auraCtx.createRadialGradient(x1, y1, 10, x1, y1, auraCanvas.width * 0.7);
            grad1.addColorStop(0, 'rgba(6, 182, 212, 0.35)');
            grad1.addColorStop(0.5, 'rgba(147, 51, 234, 0.2)');
            grad1.addColorStop(1, 'rgba(0, 0, 0, 0)');

            auraCtx.fillStyle = grad1;
            auraCtx.fillRect(0, 0, auraCanvas.width, auraCanvas.height);
            requestAnimationFrame(drawAura);
        }
        drawAura();
    </script>
</body>
</html>
