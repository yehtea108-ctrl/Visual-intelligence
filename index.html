<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Siri 視覺智慧 - iOS 空間體驗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { user-select: none; -webkit-user-select: none; }
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; overflow: hidden; height: 100vh; width: 100vw; }
        .glass-panel { background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.22); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
        .glass-btn { background: rgba(255, 255, 255, 0.18); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.28); }
        .shutter-ring { background: rgba(255, 255, 255, 0.25); border: 2px solid rgba(255, 255, 255, 0.85); box-shadow: 0 0 30px rgba(255, 255, 255, 0.4); }
        .laser-line { background: linear-gradient(180deg, transparent, rgba(56, 189, 248, 0.8), transparent); box-shadow: 0 0 15px #38bdf8; animation: scanLaser 2s infinite ease-in-out; }
        @keyframes scanLaser { 0% { top: 0%; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        .siri-glow-border { position: relative; }
        .siri-glow-border::before { content: ''; position: absolute; inset: -2px; border-radius: 9999px; background: linear-gradient(45deg, #00f2fe, #4facfe, #000000, #ff0844, #ffb199); background-size: 400% 400%; z-index: -1; animation: siriGradient 6s ease infinite; opacity: 0.75; filter: blur(4px); }
        @keyframes siriGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    </style>
</head>
<body class="relative flex flex-col justify-between">

    <!-- 背景動態流體光暈 -->
    <canvas id="auraCanvas" class="absolute inset-0 z-0 pointer-events-none w-full h-full opacity-60"></canvas>

    <!-- 相機與掃描視圖 -->
    <div class="absolute inset-0 z-0 overflow-hidden">
        <video id="cameraStream" autoplay playsinline class="w-full h-full object-cover"></video>
        <div class="absolute inset-0 bg-gradient-to-b from-black/50 via-transparent to-black/80 pointer-events-none"></div>
        <div id="laserScan" class="hidden absolute left-0 right-0 h-16 laser-line z-10 pointer-events-none"></div>
    </div>

    <!-- 隱藏檔案選取 -->
    <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">

    <!-- 頂端控制列 -->
    <div class="relative z-20 flex justify-between items-center px-6 pt-12">
        <button onclick="history.back()" class="w-11 h-11 rounded-full glass-btn flex items-center justify-center text-white">
            <i class="fa-solid fa-chevron-left text-lg"></i>
        </button>
        <span class="text-xs font-semibold tracking-widest text-cyan-300 uppercase bg-black/40 px-3 py-1 rounded-full border border-cyan-500/30">VISUAL INTELLIGENCE</span>
        <button onclick="openSettings()" class="w-11 h-11 rounded-full glass-btn flex items-center justify-center text-white">
            <i class="fa-solid fa-gear text-lg"></i>
        </button>
    </div>

    <!-- 中央動態狀態面板 -->
    <div class="relative z-20 flex flex-col items-center justify-center flex-grow px-6">
        <div id="aiStatusPill" onclick="captureAndAnalyze()" class="siri-glow-border glass-panel px-7 py-3.5 rounded-full text-white text-base font-medium flex items-center space-x-3 shadow-2xl cursor-pointer">
            <div id="statusIcon"><i class="fa-solid fa-sparkles text-cyan-300 animate-pulse text-lg"></i></div>
            <span id="pillText" class="tracking-wide">點擊快門開始視覺智慧辨識</span>
        </div>
    </div>

    <!-- 底部 Apple 原版控制按鈕區 -->
    <div class="relative z-20 pb-12 px-8 flex items-center justify-between max-w-md mx-auto w-full">
        <button onclick="showAskPrompt()" class="flex flex-col items-center space-y-1.5">
            <div class="w-16 h-16 rounded-full glass-btn flex items-center justify-center text-white text-2xl shadow-xl">
                <i class="fa-regular fa-comment"></i>
            </div>
            <span class="text-xs text-white/95 font-medium">詢問</span>
        </button>

        <button onclick="captureAndAnalyze()" class="relative w-22 h-22 rounded-full shutter-ring flex items-center justify-center p-2 active:scale-90 transition-all shadow-2xl">
            <div class="w-full h-full rounded-full bg-white/95 shadow-inner flex items-center justify-center">
                <div class="w-8 h-8 rounded-full bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500"></div>
            </div>
        </button>

        <button onclick="document.getElementById('fileInput').click()" class="flex flex-col items-center space-y-1.5">
            <div class="w-16 h-16 rounded-full glass-btn flex items-center justify-center text-white text-2xl shadow-xl">
                <i class="fa-regular fa-image"></i>
            </div>
            <span class="text-xs text-white/95 font-medium">搜尋</span>
        </button>
    </div>

    <!-- 設定視窗 -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-xl flex items-center justify-center p-6">
        <div class="glass-panel bg-gray-900/90 w-full max-w-md rounded-3xl p-6 border border-white/20 space-y-5">
            <div class="flex items-center justify-between pb-2 border-b border-white/10">
                <h2 class="text-lg font-bold text-white">設定 API Key</h2>
                <button onclick="closeSettings()" class="text-white/60 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div>
                <label class="text-xs font-semibold text-cyan-300 block mb-1.5">Google Gemini API Key</label>
                <input type="password" id="apiKeyInput" placeholder="請貼上密鑰" class="w-full bg-black/50 border border-white/20 rounded-2xl px-4 py-3 text-white text-sm focus:outline-none focus:border-cyan-400">
            </div>
            <button onclick="saveSettings()" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-2xl font-semibold text-white shadow-lg">儲存設定</button>
        </div>
    </div>

    <script>
        // 預先載入指定的 API Key (若本機尚未設定的話)[span_2](start_span)[span_2](end_span)[span_3](start_span)[span_3](end_span)
        const PRESET_API_KEY = "AIzaSyCllR8IawGzKygvrrZj8IbfszV0Mi9vjyo";
        if (!localStorage.getItem('gemini_api_key')) {
            localStorage.setItem('gemini_api_key', PRESET_API_KEY);
        }

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { document.getElementById('cameraStream').srcObject = stream; })
            .catch(err => { console.log("相機未啟動"); });

        function openSettings() {
            document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || PRESET_API_KEY;
            document.getElementById('settingsModal').classList.remove('hidden');
        }
        function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }
        function saveSettings() {
            const val = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('gemini_api_key', val || PRESET_API_KEY);
            closeSettings();
            alert('已成功更新 API Key！');
        }

        function showAskPrompt() {
            const userText = prompt("請輸入想詢問的問題：", "這是什麼？");
            if (userText) captureAndAnalyze(userText);
        }

        async function captureAndAnalyze(customPrompt = null) {
            const apiKey = localStorage.getItem('gemini_api_key') || PRESET_API_KEY;

            document.getElementById('laserScan').classList.remove('hidden');
            document.getElementById('pillText').innerText = 'Siri 視覺分析中...';

            const video = document.getElementById('cameraStream');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

            sendToGemini(base64Image, apiKey, customPrompt);
        }

        function handleFileSelect(event) {
            const apiKey = localStorage.getItem('gemini_api_key') || PRESET_API_KEY;
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('laserScan').classList.remove('hidden');
            document.getElementById('pillText').innerText = '正在讀取影像...';

            const reader = new FileReader();
            reader.onload = function(e) {
                sendToGemini(e.target.result.split(',')[1], apiKey, null);
            };
            reader.readAsDataURL(file);
        }

        async function sendToGemini(base64Image, apiKey, customPrompt) {
            const promptText = customPrompt || "請用繁體中文簡短回答：這是什麼？";
            
            // 使用您捷徑對應的 gemini-flash-lite-latest 模型端點[span_4](start_span)[span_4](end_span)
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: promptText },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                document.getElementById('laserScan').classList.add('hidden');

                if (data.candidates && data.candidates[0].content) {
                    const text = data.candidates[0].content.parts[0].text;
                    document.getElementById('pillText').innerText = text;
                } else if (data.error) {
                    document.getElementById('pillText').innerText = 'API 錯誤: ' + data.error.message;
                } else {
                    document.getElementById('pillText').innerText = '解析回應失敗';
                }
            } catch (err) {
                document.getElementById('laserScan').classList.add('hidden');
                document.getElementById('pillText').innerText = '網路連線失敗';
                console.error(err);
            }
        }

        // 動態背景光暈動畫
        const auraCanvas = document.getElementById('auraCanvas');
        const auraCtx = auraCanvas.getContext('2d');
        function resizeAura() { auraCanvas.width = window.innerWidth; auraCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeAura);
        resizeAura();
        let step = 0;
        function drawAura() {
            step += 0.01;
            auraCtx.clearRect(0, 0, auraCanvas.width, auraCanvas.height);
            const x1 = auraCanvas.width * 0.5 + Math.sin(step) * 100;
            const y1 = auraCanvas.height * 0.7 + Math.cos(step * 0.8) * 80;
            const grad1 = auraCtx.createRadialGradient(x1, y1, 10, x1, y1, auraCanvas.width * 0.7);
            grad1.addColorStop(0, 'rgba(6, 182, 212, 0.35)');
            grad1.addColorStop(0.5, 'rgba(147, 51, 234, 0.2)');
            grad1.addColorStop(1, 'rgba(0, 0, 0, 0)');
            auraCtx.fillStyle = grad1;
            auraCtx.fillRect(0, 0, auraCanvas.width, auraCanvas.height);
            requestAnimationFrame(drawAura);
        }
        drawAura();
    </script>
</body>
</html>
