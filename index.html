<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>視覺智慧</title>
    <!-- 設定 Apple PWA App 縮圖與標題 -->
    <link rel="apple-touch-icon" href="https://i.imgur.com/your_icon_placeholder.png" id="appFavicon">
    <link rel="icon" type="image/png" href="https://i.imgur.com/your_icon_placeholder.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="視覺智慧">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { user-select: none; -webkit-user-select: none; box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif; overflow: hidden; height: 100vh; width: 100vw; position: relative; }

        /* 螢幕外圍彩光光環掃描動畫 */
        .apple-edge-glow {
            position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: 0; transition: opacity 0.4s ease;
            box-shadow: inset 0 0 35px 8px rgba(56, 189, 248, 0.6), inset 0 0 60px 20px rgba(168, 85, 247, 0.5), inset 0 0 90px 35px rgba(236, 72, 153, 0.4);
            animation: auraPulse 2s infinite alternate ease-in-out;
        }
        .apple-edge-glow.active { opacity: 1; }
        @keyframes auraPulse {
            0% { box-shadow: inset 0 0 30px 6px rgba(56, 189, 248, 0.7), inset 0 0 50px 15px rgba(168, 85, 247, 0.5); }
            100% { box-shadow: inset 0 0 50px 14px rgba(56, 189, 248, 0.9), inset 0 0 85px 30px rgba(168, 85, 247, 0.7); }
        }

        /* 蘋果原版懸浮膠囊 (Pill Card) */
        .apple-pill-card {
            background: rgba(30, 30, 35, 0.65);
            backdrop-filter: blur(35px) saturate(200%);
            -webkit-backdrop-filter: blur(35px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        .siri-pill-border::before {
            content: ''; position: absolute; inset: -1.5px; border-radius: 9999px;
            background: linear-gradient(90deg, #38bdf8, #a855f7, #ec4899, #38bdf8);
            background-size: 300% 300%; z-index: -1; animation: siriBorderFlow 4s linear infinite; opacity: 0.85; filter: blur(3px);
        }
        @keyframes siriBorderFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* 蘋果原版毛玻璃圖示按鈕 */
        .glass-btn-apple {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .glass-btn-apple:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.3); }

        /* 中央雙環快門 (高仿圖示風格) */
        .shutter-outer-ring {
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
            transition: transform 0.15s ease;
        }
        .shutter-outer-ring:active { transform: scale(0.90); }
    </style>
</head>
<body class="flex flex-col justify-between">

    <!-- 外圍彩光環 -->
    <div id="appleEdgeGlow" class="apple-edge-glow"></div>

    <!-- 相機背景預覽 -->
    <div class="absolute inset-0 z-0 overflow-hidden">
        <video id="cameraStream" autoplay playsinline class="w-full h-full object-cover"></video>
        <div class="absolute inset-0 bg-gradient-to-b from-black/25 via-transparent to-black/80 pointer-events-none"></div>
    </div>

    <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">

    <!-- 頂部設定按鈕 -->
    <div class="relative z-30 pt-12 px-6 flex justify-end">
        <button onclick="openSettings()" class="w-9 h-9 rounded-full glass-btn-apple flex items-center justify-center text-white/80">
            <i class="fa-solid fa-gear text-sm"></i>
        </button>
    </div>

    <!-- 對話訊息氣泡 (固定在控制鈕上方) -->
    <div class="relative z-30 flex flex-col items-center pb-5 px-6 mt-auto">
        <div id="aiStatusPill" onclick="captureAndAnalyze()" class="siri-pill-border apple-pill-card px-6 py-3 rounded-full text-white text-sm font-medium flex items-center space-x-2.5 shadow-2xl cursor-pointer active:scale-95 transition-all">
            <span id="pillIcon" class="text-cyan-300"><i class="fa-solid fa-sparkles"></i></span>
            <span id="pillText" class="tracking-wide">點擊快門開始辨識</span>
        </div>
    </div>

    <!-- 底部控制按鈕區 (完全對照截圖中的 詢問 / 快門 / 搜尋) -->
    <div class="relative z-30 pb-10 px-10 flex items-center justify-between max-w-sm mx-auto w-full">
        <!-- 左側：詢問 (Ask) -->
        <button onclick="openAskDrawer()" class="flex flex-col items-center space-y-1.5 group">
            <div class="w-14 h-14 rounded-full glass-btn-apple flex items-center justify-center text-white text-xl shadow-lg">
                <i class="fa-regular fa-comment-dots"></i>
            </div>
            <span class="text-[12px] text-white/90 font-medium tracking-wide">詢問</span>
        </button>

        <!-- 中央：主快門按鈕 (內含彩球漸層) -->
        <button onclick="captureAndAnalyze()" class="relative w-20 h-20 rounded-full shutter-outer-ring flex items-center justify-center p-1.5 shadow-2xl">
            <div class="w-full h-full rounded-full bg-white/95 shadow-inner flex items-center justify-center">
                <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-cyan-400 via-purple-500 to-pink-500 shadow-md"></div>
            </div>
        </button>

        <!-- 右側：搜尋 (Search) -->
        <button onclick="document.getElementById('fileInput').click()" class="flex flex-col items-center space-y-1.5 group">
            <div class="w-14 h-14 rounded-full glass-btn-apple flex items-center justify-center text-white text-xl shadow-lg">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <span class="text-[12px] text-white/90 font-medium tracking-wide">搜尋</span>
        </button>
    </div>

    <!-- iOS 27 風格：詢問對話抽屜 (Drawer Modal) -->
    <div id="askDrawer" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex items-end justify-center">
        <div class="apple-pill-card bg-gray-900/95 w-full max-w-lg rounded-t-3xl p-6 border-t border-white/20 space-y-4 animate-slide-up">
            <div class="w-12 h-1.5 bg-white/30 rounded-full mx-auto mb-2"></div>
            <div class="flex items-center justify-between">
                <h3 class="text-base font-bold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-sparkles text-cyan-400"></i>
                    <span>向視覺智慧提問</span>
                </h3>
                <button onclick="closeAskDrawer()" class="text-white/60 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div>
                <input type="text" id="customPromptInput" placeholder="例如：這項產品多少錢？或翻譯這段文字..." class="w-full bg-black/50 border border-white/20 rounded-2xl px-4 py-3.5 text-white text-sm focus:outline-none focus:border-cyan-400">
            </div>
            <button onclick="submitCustomAsk()" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-purple-600 rounded-2xl font-semibold text-white shadow-lg active:scale-98 transition-transform">
                送出提問
            </button>
        </div>
    </div>

    <!-- 設定視窗 (Modal) -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-2xl flex items-center justify-center p-6">
        <div class="apple-pill-card bg-gray-900/90 w-full max-w-md rounded-3xl p-6 border border-white/20 space-y-4">
            <div class="flex items-center justify-between pb-2 border-b border-white/10">
                <h2 class="text-base font-bold text-white">視覺智慧設定</h2>
                <button onclick="closeSettings()" class="text-white/60 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div>
                <label class="text-xs text-cyan-300 block mb-1">Gemini API Key</label>
                <input type="password" id="apiKeyInput" class="w-full bg-black/60 border border-white/20 rounded-2xl px-4 py-3 text-white text-sm focus:outline-none focus:border-cyan-400">
            </div>
            <button onclick="saveSettings()" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-2xl font-semibold text-white shadow-lg">儲存變更</button>
        </div>
    </div>

    <script>
        // 預載入指定的 API 金鑰與模型[span_2](start_span)[span_2](end_span)[span_3](start_span)[span_3](end_span)
        const PRESET_API_KEY = "AIzaSyCllR8IawGzKygvrrZj8IbfszV0Mi9vjyo";
        if (!localStorage.getItem('gemini_api_key')) {
            localStorage.setItem('gemini_api_key', PRESET_API_KEY);
        }

        // 啟動相機
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { document.getElementById('cameraStream').srcObject = stream; })
            .catch(err => { console.log("相機未啟動"); });

        function openSettings() {
            document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || PRESET_API_KEY;
            document.getElementById('settingsModal').classList.remove('hidden');
        }
        function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }
        function saveSettings() {
            const val = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('gemini_api_key', val || PRESET_API_KEY);
            closeSettings();
            alert('設定已儲存！');
        }

        // iOS 27 風格對話抽屜控制
        function openAskDrawer() { document.getElementById('askDrawer').classList.remove('hidden'); }
        function closeAskDrawer() { document.getElementById('askDrawer').classList.add('hidden'); }
        function submitCustomAsk() {
            const promptText = document.getElementById('customPromptInput').value.trim();
            closeAskDrawer();
            if (promptText) captureAndAnalyze(promptText);
        }

        // 拍照與視覺智慧分析
        async function captureAndAnalyze(customPrompt = null) {
            const apiKey = localStorage.getItem('gemini_api_key') || PRESET_API_KEY;

            document.getElementById('appleEdgeGlow').classList.add('active');
            document.getElementById('pillText').innerText = '分析中...';
            document.getElementById('pillIcon').innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i>`;

            const video = document.getElementById('cameraStream');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

            sendToGemini(base64Image, apiKey, customPrompt);
        }

        function handleFileSelect(event) {
            const apiKey = localStorage.getItem('gemini_api_key') || PRESET_API_KEY;
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('appleEdgeGlow').classList.add('active');
            document.getElementById('pillText').innerText = '讀取相片中...';
            document.getElementById('pillIcon').innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i>`;

            const reader = new FileReader();
            reader.onload = function(e) {
                sendToGemini(e.target.result.split(',')[1], apiKey, null);
            };
            reader.readAsDataURL(file);
        }

        // 呼叫 Gemini API[span_4](start_span)[span_4](end_span)
        async function sendToGemini(base64Image, apiKey, customPrompt) {
            const promptText = customPrompt || "請用繁體中文簡短回答（例如：可能是：百香果）";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: promptText },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                document.getElementById('appleEdgeGlow').classList.remove('active');

                if (data.candidates && data.candidates[0].content) {
                    const text = data.candidates[0].content.parts[0].text;
                    document.getElementById('pillText').innerText = text;
                    document.getElementById('pillIcon').innerHTML = `<i class="fa-solid fa-sparkles"></i>`;
                } else if (data.error) {
                    document.getElementById('pillText').innerText = '錯誤: ' + data.error.message;
                    document.getElementById('pillIcon').innerHTML = `<i class="fa-solid fa-circle-exclamation text-amber-400"></i>`;
                } else {
                    document.getElementById('pillText').innerText = '無法辨識';
                    document.getElementById('pillIcon').innerHTML = `<i class="fa-solid fa-circle-exclamation text-amber-400"></i>`;
                }
            } catch (err) {
                document.getElementById('appleEdgeGlow').classList.remove('active');
                document.getElementById('pillText').innerText = '連線失敗';
                document.getElementById('pillIcon').innerHTML = `<i class="fa-solid fa-wifi"></i>`;
                console.error(err);
            }
        }
    </script>
</body>
</html>
